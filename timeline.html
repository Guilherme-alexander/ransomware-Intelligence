<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline — Ransomware Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #080c14;
      --surface: #0e1420;
      --border:  #1c2535;
      --accent:  #0ea5e9;
      --text:    #e2e8f0;
      --muted:   #475569;
      --subtle:  #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* ── NAV ── */
    nav { background: rgba(14,20,32,.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 100; }
    .nav-link { color: var(--muted); font-size: .8rem; font-weight: 600; letter-spacing: .05em; padding: .5rem .75rem; border-radius: 6px; transition: all .2s; text-decoration: none; display: inline-block; }
    .nav-link:hover { color: var(--accent); background: rgba(14,165,233,.08); }
    .nav-link.active { color: var(--accent); background: rgba(14,165,233,.12); }

    /* ── HERO ── */
    .hero { padding: 2.5rem 1.5rem 1.5rem; max-width: 900px; margin: 0 auto; }
    .hero h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
    .hero p { color: var(--subtle); font-size: .82rem; font-family: 'JetBrains Mono', monospace; margin-top: .5rem; }

    /* ── FILTER BAR ── */
    .filter-bar { display: flex; flex-wrap: wrap; gap: .5rem; max-width: 900px; margin: 0 auto 2rem; padding: 0 1.5rem; }
    .era-btn { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 100px; padding: .35rem 1rem; font-size: .72rem; font-family: 'Syne', sans-serif; font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap; }
    .era-btn:hover { border-color: var(--accent); color: var(--accent); }
    .era-btn.active { color: #fff; }
    .era-btn[data-era="all"].active { background: #334155; border-color: #334155; }

    /* ── TIMELINE WRAPPER ── */
    .tl-outer { max-width: 900px; margin: 0 auto; padding: 0 1.5rem 4rem; }

    /* Central spine */
    .tl-spine { position: relative; }
    .tl-spine::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent 0%, var(--border) 5%, var(--border) 95%, transparent 100%);
      transform: translateX(-50%);
    }

    /* Year marker */
    .year-marker {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2rem 0 .5rem;
    }
    .year-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: .3rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      font-weight: 700;
      color: var(--subtle);
      position: relative;
      z-index: 1;
    }
    .year-pill.era-start {
      border-width: 2px;
      color: var(--text);
    }

    /* Event row — alternating left/right */
    .event-row {
      display: grid;
      grid-template-columns: 1fr 28px 1fr;
      gap: 0;
      align-items: start;
      margin-bottom: 1.25rem;
      position: relative;
    }

    .event-left  { grid-column: 1; padding-right: 1.5rem; text-align: right; }
    .event-right { grid-column: 3; padding-left:  1.5rem; text-align: left;  }
    .event-dot   { grid-column: 2; display: flex; justify-content: center; padding-top: .8rem; }

    /* Dot */
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      transition: all .25s;
      position: relative;
      flex-shrink: 0;
    }
    .dot.pulse-ring::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid currentColor;
      opacity: .35;
      animation: ripple 2s ease-out infinite;
    }
    @keyframes ripple { 0%{transform:scale(.7);opacity:.35} 100%{transform:scale(1.8);opacity:0} }
    .dot:hover { transform: scale(1.35); }

    /* Event card */
    .event-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .9rem 1.1rem;
      cursor: pointer;
      transition: border-color .2s, transform .2s, box-shadow .2s;
      position: relative;
    }
    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,.45);
    }
    .event-card.active { border-width: 2px; }

    /* Card accent stripe (left or right depending on side) */
    .event-left .event-card::after {
      content: '';
      position: absolute;
      right: -1px; top: 12px; bottom: 12px;
      width: 3px;
      border-radius: 0 3px 3px 0;
    }
    .event-right .event-card::after {
      content: '';
      position: absolute;
      left: -1px; top: 12px; bottom: 12px;
      width: 3px;
      border-radius: 3px 0 0 3px;
    }

    .card-date { font-size: .65rem; font-family: 'JetBrains Mono', monospace; color: var(--muted); margin-bottom: .3rem; }
    .card-title { font-size: .88rem; font-weight: 700; line-height: 1.3; margin-bottom: .3rem; }
    .card-desc  { font-size: .75rem; color: var(--subtle); line-height: 1.5; }

    .badge { display: inline-block; font-size: .58rem; padding: .12rem .4rem; border-radius: 4px; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-bottom: .35rem; }

    /* ── DETAIL PANEL ── */
    #detailPanel {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: min(400px, 92vw);
      background: #0a0f1a;
      border-left: 1px solid var(--border);
      z-index: 200;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      padding: 1.5rem;
    }
    #detailPanel.open { transform: translateX(0); }
    #detailPanel::-webkit-scrollbar { width: 3px; }
    #detailPanel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .dp-close { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: .35rem .65rem; cursor: pointer; font-size: .8rem; transition: all .2s; font-family: 'Syne', sans-serif; }
    .dp-close:hover { border-color: var(--accent); color: var(--accent); }
    .dp-tag { font-size: .62rem; padding: .12rem .5rem; border-radius: 100px; border: 1px solid var(--border); color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    /* Overlay for closing panel */
    #overlay { display: none; position: fixed; inset: 0; z-index: 199; }
    #overlay.open { display: block; }

    /* ── SEARCH ── */
    #searchInput {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: .45rem .85rem;
      font-size: .8rem;
      font-family: 'Syne', sans-serif;
      outline: none;
      width: 240px;
      transition: border-color .2s;
    }
    #searchInput:focus { border-color: var(--accent); }
    #searchInput::placeholder { color: var(--muted); }

    /* ── STAT CHIPS ── */
    .stats-row { display: flex; flex-wrap: wrap; gap: .5rem; max-width: 900px; margin: 0 auto 1.5rem; padding: 0 1.5rem; }
    .stat-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .35rem .85rem; font-size: .72rem; font-family: 'JetBrains Mono', monospace; color: var(--muted); }
    .stat-chip strong { color: var(--text); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .tl-spine::before { left: 16px; }
      .event-row { grid-template-columns: 32px 1fr; }
      .event-left { display: none; }
      .event-dot  { grid-column: 1; }
      .event-right { grid-column: 2; padding-left: 1rem; text-align: left; }
      .event-right .event-card::after { display: none; }
    }

    /* Fade in */
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    .fade { animation: fadeUp .4s ease both; }
    .event-card { animation: fadeUp .4s ease both; }

    .hidden { display: none !important; }
  </style>
</head>

// ── ERA CONFIG ─────────────────────────────────────────────────────────────────
const ERAS = {
  1: { name:"Pioneira",     color:"#0ea5e9", bg:"rgba(14,165,233,.1)" },
  2: { name:"Crypto+BTC",  color:"#22c55e", bg:"rgba(34,197,94,.1)"  },
  3: { name:"Worm",        color:"#f97316", bg:"rgba(249,115,22,.1)" },
  4: { name:"RaaS",        color:"#a855f7", bg:"rgba(168,85,247,.1)" },
  5: { name:"Moderno/PQ",  color:"#ef4444", bg:"rgba(239,68,68,.1)"  },
};

const TYPE_ICONS = {
  malware:   { icon:"fa-skull",         label:"Malware"     },
  incident:  { icon:"fa-bolt",          label:"Incidente"   },
  operation: { icon:"fa-shield-halved", label:"Operação"    },
  campaign:  { icon:"fa-fire",          label:"Campanha"    },
};

// ── STATE ──────────────────────────────────────────────────────────────────────
let activeEra = "all";
let searchTerm = "";
let openEventId = null;

// ── RENDER ─────────────────────────────────────────────────────────────────────
function getVisible() {
  return EVENTS.filter(e => {
    const eraOk = activeEra === "all" || String(e.era) === activeEra;
    const q = searchTerm.toLowerCase();
    const textOk = !q || [e.title, e.short, e.detail, ...e.tags].join(" ").toLowerCase().includes(q);
    return eraOk && textOk;
  });
}

function render() {
  const visible = getVisible();
  document.getElementById("stat-total").textContent = EVENTS.length;
  document.getElementById("stat-visible").textContent = visible.length;

  const container = document.getElementById("timeline");
  container.innerHTML = "";

  // Group by year
  const byYear = {};
  visible.forEach(e => { (byYear[e.year] = byYear[e.year] || []).push(e); });
  const years = Object.keys(byYear).sort((a,b)=>a-b);

  const ERA_STARTS = { 1989:1, 2013:2, 2017:3, 2019:4, 2023:5 };
  let side = 0; // alternates 0=right, 1=left

  years.forEach(yr => {
    // Year marker
    const eraId = ERA_STARTS[yr];
    const yrDiv = document.createElement("div");
    yrDiv.className = "year-marker";
    const pill = document.createElement("div");
    pill.className = "year-pill" + (eraId ? " era-start" : "");
    if (eraId) {
      const era = ERAS[eraId];
      pill.style.borderColor = era.color;
      pill.style.color = era.color;
      pill.innerHTML = `${yr} <span style="font-size:.6rem;opacity:.7;margin-left:4px">${era.name}</span>`;
    } else {
      pill.textContent = yr;
    }
    yrDiv.appendChild(pill);
    container.appendChild(yrDiv);

    // Events in this year
    byYear[yr].forEach((ev, idx) => {
      const era = ERAS[ev.era];
      const isLeft = (side % 2 === 1);
      side++;

      const row = document.createElement("div");
      row.className = "event-row";
      row.id = `row-${ev.id}`;

      // Build card HTML
      const imp = ev.importance;
      const badgeColor = imp === "critical" ? "#ef4444" : imp === "high" ? "#f97316" : "#eab308";
      const badgeLabel = imp === "critical" ? "CRÍTICO" : imp === "high" ? "ALTO" : "MÉDIO";
      const typeConf = TYPE_ICONS[ev.type];
      const tagsHtml = ev.tags.slice(0,4).map(t => `<span class="dp-tag">${t}</span>`).join(" ");

      const cardHtml = `
        <div class="card-date">${ev.date}</div>
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem;flex-wrap:wrap">
          <span class="badge" style="background:${badgeColor}20;color:${badgeColor}">${badgeLabel}</span>
          <span class="badge" style="background:rgba(255,255,255,.05);color:var(--subtle)">
            <i class="fas ${typeConf.icon}" style="margin-right:3px;font-size:.55rem"></i>${typeConf.label}
          </span>
        </div>
        <div class="card-title">${ev.title}</div>
        <div class="card-desc">${ev.short}</div>
        ${ev.notable ? `<div style="margin-top:.5rem;font-size:.62rem;color:${era.color};font-family:'JetBrains Mono',monospace">★ Evento marcante</div>` : ""}
      `;

      // Build card element
      const cardEl = document.createElement("div");
      cardEl.className = "event-card";
      cardEl.innerHTML = cardHtml;
      cardEl.style.borderColor = "var(--border)";
      cardEl.style.setProperty("--ec", era.color);
      cardEl.addEventListener("click", () => openDetail(ev.id));
      cardEl.addEventListener("mouseenter", () => { cardEl.style.borderColor = era.color; });
      cardEl.addEventListener("mouseleave", () => {
        if (openEventId !== ev.id) cardEl.style.borderColor = "var(--border)";
      });

      // Card stripe (via pseudo-element mimic via box-shadow)
      const stripeDiv = document.createElement("div");
      stripeDiv.style.cssText = `position:absolute;${isLeft?'right':'left'}:-1px;top:14px;bottom:14px;width:3px;border-radius:${isLeft?'0 3px 3px 0':'3px 0 0 3px'};background:${era.color};`;
      cardEl.style.position = "relative";
      cardEl.appendChild(stripeDiv);

      // Dot
      const dotEl = document.createElement("div");
      dotEl.className = "dot" + (ev.notable ? " pulse-ring" : "");
      dotEl.style.cssText = `background:${era.color};border-color:${era.color};color:${era.color};`;
      dotEl.addEventListener("click", () => openDetail(ev.id));

      // Assemble row
      if (isLeft) {
        const leftCell = document.createElement("div");
        leftCell.className = "event-left";
        leftCell.appendChild(cardEl);
        const dotCell = document.createElement("div");
        dotCell.className = "event-dot";
        dotCell.appendChild(dotEl);
        const rightCell = document.createElement("div");
        rightCell.className = "event-right";
        row.appendChild(leftCell);
        row.appendChild(dotCell);
        row.appendChild(rightCell);
      } else {
        const leftCell = document.createElement("div");
        leftCell.className = "event-left";
        const dotCell = document.createElement("div");
        dotCell.className = "event-dot";
        dotCell.appendChild(dotEl);
        const rightCell = document.createElement("div");
        rightCell.className = "event-right";
        rightCell.appendChild(cardEl);
        row.appendChild(leftCell);
        row.appendChild(dotCell);
        row.appendChild(rightCell);
      }

      container.appendChild(row);
    });
  });

  if (visible.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--muted);font-size:.85rem">Nenhum evento encontrado. <button onclick="clearFilters()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-family:inherit;font-size:.85rem;text-decoration:underline">Limpar filtros</button></div>`;
  }
}

// ── DETAIL PANEL ───────────────────────────────────────────────────────────────
function openDetail(id) {
  const ev = EVENTS.find(e => e.id === id);
  if (!ev) return;
  const era = ERAS[ev.era];
  openEventId = id;

  // Highlight active card
  document.querySelectorAll(".event-card").forEach(c => {
    c.style.borderColor = "var(--border)";
    c.classList.remove("active");
  });
  const row = document.getElementById(`row-${id}`);
  if (row) {
    const card = row.querySelector(".event-card");
    if (card) { card.style.borderColor = era.color; card.classList.add("active"); }
  }

  const tagsHtml = ev.tags.map(t => `<span class="dp-tag">${t}</span>`).join(" ");
  const typeConf = TYPE_ICONS[ev.type];

  document.getElementById("dpContent").innerHTML = `
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem">
      <div style="width:28px;height:28px;border-radius:50%;background:${era.color}20;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="fas ${typeConf.icon}" style="font-size:.7rem;color:${era.color}"></i>
      </div>
      <span class="mono" style="font-size:.65rem;color:${era.color}">${ev.date}</span>
    </div>

    <h2 style="font-size:1.05rem;font-weight:800;line-height:1.3;margin-bottom:.75rem;color:var(--text)">${ev.title}</h2>

    <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem">${tagsHtml}</div>

    <div style="background:${era.color}0d;border:1px solid ${era.color}30;border-radius:8px;padding:.85rem;margin-bottom:1rem">
      <div class="mono" style="font-size:.65rem;color:${era.color};margin-bottom:.35rem">RESUMO</div>
      <div style="font-size:.8rem;color:var(--subtle);line-height:1.6">${ev.short}</div>
    </div>

    <div style="font-size:.82rem;color:var(--subtle);line-height:1.7;margin-bottom:1rem">${ev.detail}</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.65rem">
        <div class="mono" style="font-size:.6rem;color:var(--muted);margin-bottom:.2rem">ERA</div>
        <div style="font-size:.8rem;font-weight:700;color:${era.color}">${era.name}</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.65rem">
        <div class="mono" style="font-size:.6rem;color:var(--muted);margin-bottom:.2rem">IMPACTO</div>
        <div style="font-size:.8rem;font-weight:700;color:${ev.impact==='Catastrófico'?'#ef4444':ev.impact==='Crítico'?'#ef4444':ev.impact==='Muito alto'?'#f97316':'#eab308'}">${ev.impact}</div>
      </div>
    </div>

    ${ev.notable ? `<div style="display:flex;align-items:center;gap:.5rem;padding:.6rem .85rem;background:${era.color}0d;border:1px solid ${era.color}25;border-radius:8px;margin-bottom:1rem;font-size:.75rem;color:${era.color}">
      <i class="fas fa-star" style="font-size:.7rem"></i>
      Evento marcante na história do ransomware
    </div>` : ""}

    ${ev.link ? `<a href="${ev.link}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--accent);text-decoration:none;font-family:'JetBrains Mono',monospace">
      <i class="fas fa-external-link-alt" style="font-size:.65rem"></i>Fonte / referência
    </a>` : ""}
  `;

  document.getElementById("detailPanel").classList.add("open");
  document.getElementById("overlay").classList.add("open");
}

function closePanel() {
  document.getElementById("detailPanel").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
  document.querySelectorAll(".event-card").forEach(c => {
    c.style.borderColor = "var(--border)";
    c.classList.remove("active");
  });
  openEventId = null;
}

// ── FILTER FUNCTIONS ───────────────────────────────────────────────────────────
function filterEra(era) {
  activeEra = era;
  document.querySelectorAll(".era-btn").forEach(b => {
    const isActive = b.dataset.era === era;
    b.classList.toggle("active", isActive);
    if (isActive) {
      const eId = b.dataset.era;
      if (eId !== "all") {
        b.style.background = ERAS[eId]?.color || "#334155";
        b.style.borderColor = ERAS[eId]?.color || "#334155";
        b.style.color = "#fff";
      } else {
        b.style.background = "#334155";
        b.style.borderColor = "#334155";
        b.style.color = "#fff";
      }
    } else {
      b.style.background = "";
      b.style.borderColor = "";
      b.style.color = "";
    }
  });
  render();
}

function applySearch(val) {
  searchTerm = val;
  render();
}

function clearFilters() {
  searchTerm = "";
  document.getElementById("searchInput").value = "";
  filterEra("all");
}

// ── INIT ───────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
